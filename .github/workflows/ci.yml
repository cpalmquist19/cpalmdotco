name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # The guard tests run TypeScript directly, which needs Node 22.18 or newer
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Chat guard tests
        run: npm run check:guard

      # next-env.d.ts is gitignored; without it image imports don't type check
      - name: Generate Next.js types
        run: npx next typegen

      - name: Type check
        run: npx tsc --noEmit

      # Warnings fail the run too, so they get fixed when they appear instead of piling up
      - name: Lint
        run: npm run lint -- --max-warnings 0

      # The same build Vercel runs on deploy, so a broken page or config fails here first
      - name: Build
        run: npm run build
